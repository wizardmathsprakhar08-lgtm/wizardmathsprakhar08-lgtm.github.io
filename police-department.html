<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Police — Complaint Registry</title>
<style>
  :root{
    --navy:#0e1a2e; --navy2:#152540; --gold:#c9a24b; --gold-dim:#9c7d38; --steel:#3a4b63; --paper:#eef1f6; --sub:#8496b0;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--navy);color:var(--paper);font-family:'Georgia',serif;}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy2);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .badge-mark{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:700;font-size:.85rem;flex-shrink:0;}
  .brand h1{margin:0;font-size:1.1rem;font-weight:400;}
  .brand p{margin:0;font-size:.72rem;color:var(--gold);letter-spacing:.5px;font-family:Arial,sans-serif;}
  .bell-wrap{position:relative;}
  .bell{background:rgba(201,162,75,.08);border:1px solid var(--steel);color:var(--paper);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;position:relative;font-family:Arial,sans-serif;}
  .bell .dot{position:absolute;top:-6px;right:-6px;background:#b0342b;color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:Arial,sans-serif;}
  .panel{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,90vw);background:var(--navy2);border:1px solid var(--steel);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto;display:none;}
  .panel.open{display:block;}
  .panel h4{margin:0;padding:12px 14px;font-size:.72rem;letter-spacing:.5px;color:var(--gold);border-bottom:1px solid var(--steel);font-family:Arial,sans-serif;text-transform:uppercase;}
  .panel .item{padding:10px 14px;border-bottom:1px solid var(--steel);font-size:.85rem;cursor:pointer;font-family:Arial,sans-serif;}
  .panel .item:hover{background:rgba(201,162,75,.06);}
  .panel .item b{display:block;color:var(--gold);font-size:.7rem;margin-bottom:2px;}
  .panel .empty{padding:16px 14px;font-size:.8rem;color:var(--sub);font-family:Arial,sans-serif;}
  main{max-width:960px;margin:0 auto;padding:26px 20px 60px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
  .stat{background:var(--navy2);border-radius:10px;padding:14px 16px;border:1px solid var(--steel);}
  .stat .n{font-size:1.9rem;font-weight:700;font-family:Arial,sans-serif;}
  .stat .l{font-size:.72rem;color:var(--gold);letter-spacing:.3px;font-family:Arial,sans-serif;text-transform:uppercase;}
  .stat.new .n{color:#c85a4d;}
  form{background:var(--navy2);border-radius:12px;padding:20px;margin-bottom:28px;border:1px solid var(--steel);}
  form h2{margin:0 0 4px;font-size:1.15rem;font-weight:400;}
  form p.sub{margin:0 0 16px;font-size:.82rem;color:var(--sub);font-family:Arial,sans-serif;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  input,textarea,select{width:100%;border:1px solid var(--steel);background:var(--navy);color:var(--paper);border-radius:7px;padding:10px 11px;font-size:.9rem;font-family:Arial,sans-serif;}
  textarea{min-height:70px;resize:vertical;grid-column:1/-1;}
  button.submit{background:var(--gold);color:var(--navy);border:none;border-radius:7px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:.9rem;font-family:Arial,sans-serif;}
  button.submit:hover{background:var(--gold-dim);}
  .list h2{font-size:1.15rem;margin:0 0 14px;font-weight:400;}
  .card{background:var(--navy2);border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--steel);display:flex;gap:14px;justify-content:space-between;align-items:flex-start;}
  .card.is-new{border-left:4px solid #b0342b;}
  .card .meta{font-size:.7rem;color:var(--gold);letter-spacing:.3px;margin-bottom:4px;font-family:Arial,sans-serif;}
  .card p{margin:4px 0 6px;font-size:.92rem;line-height:1.45;}
  .card .who{font-size:.78rem;color:var(--sub);font-family:Arial,sans-serif;}
  .badge{font-size:.68rem;padding:3px 10px;border-radius:20px;white-space:nowrap;height:fit-content;font-family:Arial,sans-serif;}
  .badge.new{background:rgba(176,52,43,.2);color:#e88c80;}
  .badge.read{background:rgba(201,162,75,.15);color:var(--gold);}
  .badge.resolved{background:rgba(90,150,120,.15);color:#7fc79a;}
  .actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .actions button{background:none;border:1px solid var(--steel);color:var(--paper);font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:Arial,sans-serif;}
  .actions button:hover{border-color:var(--gold);color:var(--gold);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--sub);font-size:.9rem;font-family:Arial,sans-serif;}
  .ja-tag{display:inline-block;margin-left:6px;font-size:.65rem;padding:2px 7px;border-radius:20px;background:rgba(34,211,168,.15);color:#22d3a8;vertical-align:middle;font-weight:700;letter-spacing:.3px;font-family:Arial,sans-serif;}
  ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--steel);border-radius:4px;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="badge-mark">PD</div>
    <div><h1>City Police Department</h1><p>COMPLAINT REGISTRY</p></div>
  </div>
  <div class="bell-wrap">
    <button class="bell" id="bellBtn">Notifications<span class="dot" id="bellCount" style="display:none">0</span></button>
    <div class="panel" id="bellPanel"><h4>New complaints</h4><div id="bellList"></div></div>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat new"><div class="n" id="statNew">0</div><div class="l">New</div></div>
    <div class="stat"><div class="n" id="statRead">0</div><div class="l">Under investigation</div></div>
    <div class="stat"><div class="n" id="statResolved">0</div><div class="l">Closed</div></div>
  </div>

  <form id="complaintForm">
    <h2>File a complaint</h2>
    <p class="sub">For an emergency in progress, call 100/112 directly. Use this form for non-emergency reports and complaints.</p>
    <div class="row">
      <input type="text" id="cName" placeholder="Your name" required>
      <input type="text" id="cContact" placeholder="Phone or email" required>
    </div>
    <div class="row">
      <select id="cType">
        <option>Theft / burglary</option>
        <option>Harassment</option>
        <option>Noise / public disturbance</option>
        <option>Traffic violation</option>
        <option>Fraud / cybercrime</option>
        <option>Conduct complaint against officer</option>
        <option>Other</option>
      </select>
      <input type="text" id="cLocation" placeholder="Location" required>
    </div>
    <textarea id="cDetails" placeholder="Describe the incident..." required></textarea>
    <button type="submit" class="submit">Submit complaint</button>
  </form>

  <div class="list">
    <h2>Case log</h2>
    <div id="complaintList"></div>
  </div>
</main>
<script src="sync.js"></script>
<script>
const STORE_KEY='police_dept_complaints_v1';
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||seed(); }catch(e){ return seed(); } }
function save(list){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){} }
function seed(){
  const now=Date.now();
  const s=[
    {id:1,name:'K. Fernandes',contact:'k.f@mail.com',type:'Theft / burglary',location:'Sector 5 Market',details:'Bike stolen from outside the shop around 8pm yesterday.',time:now-10800e3,status:'new'},
    {id:2,name:'R. Verma',contact:'98xxxx3345',type:'Noise / public disturbance',location:'Green Avenue',details:'Loud construction noise continuing past midnight for a week.',time:now-345600e3,status:'read'}
  ];
  save(s); return s;
}
let complaints = load();
function caseNo(id){ return 'FIR-'+String(id).slice(-6); }
function fmtTime(t){ const d=new Date(t); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function render(){
  const list = document.getElementById('complaintList');
  const sorted=[...complaints].sort((a,b)=>b.time-a.time);
  list.innerHTML = sorted.length? '' : '<div class="empty-state">No complaints filed yet.</div>';
  sorted.forEach(c=>{
    const div=document.createElement('div');
    div.className='card'+(c.status==='new'?' is-new':'');
    div.innerHTML = `
      <div style="flex:1">
        <div class="meta">${caseNo(c.id)} · ${c.type} · ${fmtTime(c.time)} · ${escapeHtml(c.location)}${c.janAwaazId?'<span class="ja-tag">via JanAwaaz</span>':''}</div>
        <p>${escapeHtml(c.details)}</p>
        <div class="who">Filed by ${escapeHtml(c.name)} (${escapeHtml(c.contact)})</div>
      </div>
      <div class="actions">
        <span class="badge ${c.status}">${c.status==='new'?'New':c.status==='read'?'Investigating':'Closed'}</span>
        ${c.status==='new'?'<button data-act="read" data-id="'+c.id+'">Open investigation</button>':''}
        ${c.status!=='resolved'?'<button data-act="resolve" data-id="'+c.id+'">Close case</button>':''}
      </div>`;
    list.appendChild(div);
  });
  list.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id=Number(btn.dataset.id), act=btn.dataset.act;
      const c=complaints.find(x=>x.id===id); if(!c) return;
      c.status = act==='read' ? 'read' : 'resolved';
      window.JASync && c.janAwaazId && JASync.syncStatus(c.janAwaazId, c.status, JASync.deptNameFor(STORE_KEY));
      save(complaints); render(); renderBell();
    });
  });
  document.getElementById('statNew').textContent = complaints.filter(c=>c.status==='new').length;
  document.getElementById('statRead').textContent = complaints.filter(c=>c.status==='read').length;
  document.getElementById('statResolved').textContent = complaints.filter(c=>c.status==='resolved').length;
}

function renderBell(){
  const newOnes = complaints.filter(c=>c.status==='new').sort((a,b)=>b.time-a.time);
  const dot=document.getElementById('bellCount');
  if(newOnes.length){ dot.style.display='flex'; dot.textContent=newOnes.length; } else { dot.style.display='none'; }
  const bl=document.getElementById('bellList');
  bl.innerHTML = newOnes.length? '' : '<div class="empty">No new complaints.</div>';
  newOnes.forEach(c=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<b>${caseNo(c.id)} — ${c.type}</b>${escapeHtml(c.location)} — ${escapeHtml(c.name)}`;
    d.addEventListener('click', ()=>{ c.status='read'; window.JASync && c.janAwaazId && JASync.syncStatus(c.janAwaazId, c.status, JASync.deptNameFor(STORE_KEY)); save(complaints); render(); renderBell(); });
    bl.appendChild(d);
  });
}

document.getElementById('bellBtn').addEventListener('click', ()=>{
  document.getElementById('bellPanel').classList.toggle('open');
});
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.bell-wrap')) document.getElementById('bellPanel').classList.remove('open');
});

document.getElementById('complaintForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const c = {
    id: Date.now(),
    name: document.getElementById('cName').value.trim(),
    contact: document.getElementById('cContact').value.trim(),
    type: document.getElementById('cType').value,
    location: document.getElementById('cLocation').value.trim(),
    details: document.getElementById('cDetails').value.trim(),
    time: Date.now(),
    status: 'new'
  };
  complaints.push(c); save(complaints);
  e.target.reset(); render(); renderBell();
});

render(); renderBell();

// Live sync: a complaint dispatched from JanAwaaz updates this board in real time.
window.addEventListener('storage', (e)=>{
  if(e.key!==STORE_KEY) return;
  const prevCount = complaints.length;
  complaints = load();
  render(); renderBell();
  if(complaints.length>prevCount && window.JASync){
    const fresh = complaints.find(c=>c.source==='JanAwaaz' && c.status==='new');
    if(fresh) JASync.notify('New complaint from JanAwaaz', fresh.type + ' — ' + fresh.location);
  }
});
</script>
</body>
</html>
