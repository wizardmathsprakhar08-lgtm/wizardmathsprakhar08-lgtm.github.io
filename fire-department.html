<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Fire & Rescue — Dispatch Board</title>
<style>
  :root{
    --char:#1b1512; --char2:#241b17; --ember:#c0392b; --ember-dim:#8f2c22;
    --amber:#e8a33d; --paper:#f2ece2; --line:rgba(242,236,226,.14);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--char);color:var(--paper);font-family:'Georgia',serif;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ }
  }
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--char2);border-bottom:2px solid var(--ember);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:34px;height:34px;border-radius:50%;background:var(--ember);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:700;color:var(--char);flex-shrink:0;}
  .brand h1{font-size:1.15rem;margin:0;font-weight:400;letter-spacing:.3px;}
  .brand p{margin:0;font-size:.75rem;color:var(--amber);font-family:Arial,sans-serif;}
  .officer-link{color:var(--paper); text-decoration:none; border:1px solid var(--line); padding:9px 13px; border-radius:8px; font-size:1rem; font-weight:700; margin-right:4px; white-space:nowrap; font-family:Arial,sans-serif;}
  .officer-link:hover{border-color:var(--ember); color:var(--amber);}
  .bell-wrap{position:relative;}
  .bell{background:none;border:1px solid var(--line);color:var(--paper);border-radius:8px;padding:9px 12px;font-size:1rem;cursor:pointer;position:relative;font-family:Arial,sans-serif;}
  .bell .dot{position:absolute;top:-6px;right:-6px;background:var(--ember);color:var(--paper);font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:0 4px;}
  .panel{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,90vw);background:var(--char2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:60vh;overflow-y:auto;display:none;}
  .panel.open{display:block;}
  .panel h4{margin:0;padding:12px 14px;font-family:Arial,sans-serif;font-size:.75rem;letter-spacing:.5px;color:var(--amber);border-bottom:1px solid var(--line);}
  .panel .item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;font-family:Arial,sans-serif;cursor:pointer;}
  .panel .item:hover{background:rgba(232,163,61,.08);}
  .panel .item b{color:var(--amber);display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
  .panel .empty{padding:16px 14px;font-size:.8rem;opacity:.6;font-family:Arial,sans-serif;}
  main{max-width:960px;margin:0 auto;padding:28px 20px 60px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:26px;}
  .stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--char2);}
  .stat .n{font-size:1.8rem;font-family:Arial,sans-serif;font-weight:700;}
  .stat .l{font-size:.72rem;font-family:Arial,sans-serif;color:var(--amber);letter-spacing:.4px;}
  .new .n{color:var(--ember);}
  form{background:var(--char2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:30px;}
  form h2{margin:0 0 4px;font-weight:400;font-size:1.1rem;}
  form p.sub{margin:0 0 16px;font-size:.8rem;color:#c9bdb0;font-family:Arial,sans-serif;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  input,textarea,select{width:100%;background:var(--char);border:1px solid var(--line);color:var(--paper);border-radius:7px;padding:10px 11px;font-family:Arial,sans-serif;font-size:.9rem;}
  textarea{min-height:70px;resize:vertical;grid-column:1/-1;}
  .row input:only-child, .full{grid-column:1/-1;}
  button.submit{background:var(--ember);color:var(--paper);border:none;border-radius:7px;padding:11px 18px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer;font-size:.9rem;}
  button.submit:hover{background:var(--ember-dim);}
  .list h2{font-weight:400;font-size:1.1rem;margin:0 0 14px;}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--char2);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}
  .card.is-new{border-color:var(--ember);}
  .card .meta{font-family:Arial,sans-serif;font-size:.7rem;color:var(--amber);letter-spacing:.3px;margin-bottom:4px;}
  .card p{margin:4px 0 6px;font-size:.9rem;line-height:1.4;}
  .card .who{font-family:Arial,sans-serif;font-size:.78rem;color:#c9bdb0;}
  .badge{font-family:Arial,sans-serif;font-size:.68rem;padding:3px 9px;border-radius:20px;white-space:nowrap;height:fit-content;}
  .badge.new{background:rgba(192,57,43,.2);color:#ff8a75;border:1px solid var(--ember);}
  .badge.read{background:rgba(232,163,61,.15);color:var(--amber);border:1px solid var(--amber);}
  .badge.resolved{background:rgba(120,200,120,.12);color:#7fd08a;border:1px solid #4c9a56;}
  .actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .actions button{background:none;border:1px solid var(--line);color:var(--paper);font-family:Arial,sans-serif;font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer;}
  .actions button:hover{border-color:var(--amber);color:var(--amber);}
  .empty-state{text-align:center;padding:40px 20px;color:#8a7d70;font-family:Arial,sans-serif;font-size:.9rem;}
  .ja-tag{display:inline-block;margin-left:6px;font-size:.65rem;padding:2px 7px;border-radius:20px;background:rgba(34,211,168,.15);color:#22d3a8;vertical-align:middle;font-weight:700;letter-spacing:.3px;font-family:Arial,sans-serif;}
  ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">🔥</div>
    <div><h1>City Fire &amp; Rescue</h1><p>DISPATCH &amp; COMPLAINT BOARD</p></div>
  </div>
  <a class="officer-link" href="officer.html">Officer Console</a>
  <div class="bell-wrap">
    <button class="bell" id="bellBtn">Alerts<span class="dot" id="bellCount" style="display:none">0</span></button>
    <div class="panel" id="bellPanel"><h4>New reports</h4><div id="bellList"></div></div>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat new"><div class="n" id="statNew">0</div><div class="l">NEW REPORTS</div></div>
    <div class="stat"><div class="n" id="statRead">0</div><div class="l">UNDER REVIEW</div></div>
    <div class="stat"><div class="n" id="statResolved">0</div><div class="l">RESOLVED</div></div>
  </div>

  <form id="complaintForm">
    <h2>File an incident report</h2>
    <p class="sub">For life-threatening emergencies, always call 101/911 directly. Use this form for complaints, safety hazards, or non-urgent reports.</p>
    <div class="row">
      <input type="text" id="cName" placeholder="Your name" required>
      <input type="text" id="cContact" placeholder="Phone or email" required>
    </div>
    <div class="row">
      <select id="cType">
        <option>Fire hazard</option>
        <option>Blocked hydrant / access</option>
        <option>Slow response complaint</option>
        <option>Smoke / burning smell</option>
        <option>Other safety concern</option>
      </select>
      <input type="text" id="cLocation" placeholder="Location / address" required>
    </div>
    <textarea id="cDetails" placeholder="Describe what happened..." required></textarea>
    <button type="submit" class="submit">Submit report</button>
  </form>

  <div class="list">
    <h2>Incoming reports</h2>
    <div id="complaintList"></div>
  </div>
</main>
<script src="sync.js"></script>
<script>
const STORE_KEY='fire_dept_complaints_v1';
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||seed(); }catch(e){ return seed(); } }
function save(list){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){} }
function seed(){
  const now=Date.now();
  const s=[
    {id:1,name:'R. Mehta',contact:'98xxxx1234',type:'Blocked hydrant / access',location:'Sector 12, Lane 4',details:'A delivery truck has been parked in front of the hydrant for two days.',time:now-3600e3,status:'new'},
    {id:2,name:'A. Sharma',contact:'a.sharma@mail.com',type:'Slow response complaint',location:'MG Road',details:'Truck took 40 minutes to arrive during last week\'s kitchen fire call.',time:now-86400e3,status:'read'}
  ];
  save(s); return s;
}
let complaints = load();

function fmtTime(t){ const d=new Date(t); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

function render(){
  const list = document.getElementById('complaintList');
  const sorted=[...complaints].sort((a,b)=>b.time-a.time);
  list.innerHTML = sorted.length? '' : '<div class="empty-state">No reports yet. Submitted reports will appear here.</div>';
  sorted.forEach(c=>{
    const div=document.createElement('div');
    div.className='card'+(c.status==='new'?' is-new':'');
    div.innerHTML = `
      <div style="flex:1">
        <div class="meta">${c.type.toUpperCase()} · ${fmtTime(c.time)} · ${escapeHtml(c.location)}${c.janAwaazId?'<span class="ja-tag">via JanAwaaz</span>':''}</div>
        <p>${escapeHtml(c.details)}</p>
        <div class="who">Filed by ${escapeHtml(c.name)} (${escapeHtml(c.contact)})</div>
      </div>
      <div class="actions">
        <span class="badge ${c.status}">${c.status==='new'?'New':c.status==='read'?'Under review':'Resolved'}</span>
        ${c.status==='new'?'<button data-act="read" data-id="'+c.id+'">Mark reviewed</button>':''}
        ${c.status!=='resolved'?'<button data-act="resolve" data-id="'+c.id+'">Mark resolved</button>':''}
      </div>`;
    list.appendChild(div);
  });
  list.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id=Number(btn.dataset.id), act=btn.dataset.act;
      const c=complaints.find(x=>x.id===id);
      if(!c) return;
      c.status = act==='read' ? 'read' : 'resolved';
      window.JASync && c.janAwaazId && JASync.syncStatus(c.janAwaazId, c.status, JASync.deptNameFor(STORE_KEY));
      save(complaints); render(); renderBell();
    });
  });
  document.getElementById('statNew').textContent = complaints.filter(c=>c.status==='new').length;
  document.getElementById('statRead').textContent = complaints.filter(c=>c.status==='read').length;
  document.getElementById('statResolved').textContent = complaints.filter(c=>c.status==='resolved').length;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderBell(){
  const newOnes = complaints.filter(c=>c.status==='new').sort((a,b)=>b.time-a.time);
  const dot=document.getElementById('bellCount');
  if(newOnes.length){ dot.style.display='flex'; dot.textContent=newOnes.length; } else { dot.style.display='none'; }
  const bl=document.getElementById('bellList');
  bl.innerHTML = newOnes.length? '' : '<div class="empty">No new reports.</div>';
  newOnes.forEach(c=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<b>${c.type}</b>${escapeHtml(c.location)} — ${escapeHtml(c.name)}`;
    d.addEventListener('click', ()=>{ c.status='read'; window.JASync && c.janAwaazId && JASync.syncStatus(c.janAwaazId, c.status, JASync.deptNameFor(STORE_KEY)); save(complaints); render(); renderBell(); });
    bl.appendChild(d);
  });
}

document.getElementById('bellBtn').addEventListener('click', (e)=>{
  document.getElementById('bellPanel').classList.toggle('open');
});
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.bell-wrap')) document.getElementById('bellPanel').classList.remove('open');
});

document.getElementById('complaintForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const c = {
    id: Date.now(),
    name: document.getElementById('cName').value.trim(),
    contact: document.getElementById('cContact').value.trim(),
    type: document.getElementById('cType').value,
    location: document.getElementById('cLocation').value.trim(),
    details: document.getElementById('cDetails').value.trim(),
    time: Date.now(),
    status: 'new'
  };
  complaints.push(c);
  save(complaints);
  e.target.reset();
  render(); renderBell();
});

render(); renderBell();

// Live sync: a complaint dispatched from JanAwaaz updates this board in real time.
window.addEventListener('storage', (e)=>{
  if(e.key!==STORE_KEY) return;
  const prevCount = complaints.length;
  complaints = load();
  render(); renderBell();
  if(complaints.length>prevCount && window.JASync){
    const fresh = complaints.find(c=>c.source==='JanAwaaz' && c.status==='new');
    if(fresh) JASync.notify('New complaint from JanAwaaz', fresh.type + ' — ' + fresh.location);
  }
});
</script>
</body>
</html>
